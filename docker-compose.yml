version: "3.9"

services:
  creditguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creditguard-app
    ports:
      - "8501:8501"
    volumes:
      # Persist the database across container restarts
      - creditguard-db:/app/data
      # Mount secrets (create .streamlit/secrets.toml before running)
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    environment:
      - APP_ENV=production
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  creditguard-db:
    driver: local
